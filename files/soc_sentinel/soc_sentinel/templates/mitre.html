{% extends "layout.html" %}
{% block title %}MITRE ATT&CK — SOC Sentinel{% endblock %}
{% block content %}
<div class="page-header">
    <h1>MITRE ATT&amp;CK Tactics</h1>
    <p class="page-sub">The 14 Enterprise tactics, in kill-chain order.</p>
</div>

<div class="mitre-list">
    {% for tid, name, desc in tactics %}
    <div class="mitre-item">
        <div class="mitre-id">{{ tid }}</div>
        <div class="mitre-body">
            <div class="mitre-name">{{ name }}</div>
            <div class="mitre-desc">{{ desc }}</div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
