{% extends "layout.html" %}
{% block title %}Port Reference — SOC Sentinel{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Port Reference</h1>
    <p class="page-sub">Common ports and their typical services.</p>
</div>

<table class="history-table">
    <thead>
        <tr>
            <th>Port</th>
            <th>Service</th>
        </tr>
    </thead>
    <tbody>
        {% for port, service in ports %}
        <tr>
            <td class="mono">{{ port }}</td>
            <td>{{ service }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
