{% extends "layout.html" %}
{% block title %}Register — SOC Sentinel{% endblock %}
{% block auth_content %}
<div class="auth-screen">
    <div class="auth-card">
        <div class="brand auth-brand">
            <span class="brand-mark">&#9679;</span>
            <span class="brand-name">SOC SENTINEL</span>
        </div>
        <p class="auth-tagline">Create your analyst account</p>
        <form method="post" class="auth-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
            <label for="confirmation">Confirm password</label>
            <input type="password" id="confirmation" name="confirmation" autocomplete="new-password" required>
            <button type="submit" class="btn-primary">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
</div>
{% endblock %}
